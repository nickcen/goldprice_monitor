spring:
  config:
    import: file:./.env.prod[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
app:
  jwt-secret: ${APP_JWT_SECRET}
  price-server-base-url: https://coinapi.gcsgcs.com
  system-salt: ${APP_SYSTEM_SALT}
