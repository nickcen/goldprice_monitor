spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/goldprice_monitor?connectionTimeZone=UTC}
    username: ${DB_USER:test}
    password: ${DB_PASSWORD:test}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    time-zone: UTC
mybatis:
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  jwt-secret: ${APP_JWT_SECRET:}
  admin-username: ${APP_ADMIN_USERNAME:}
  admin-password: ${APP_ADMIN_PASSWORD:}
  price-source-url: ${APP_PRICE_SOURCE_URL:}
  currency: ${APP_CURRENCY:CNY}
  unit: ${APP_PRICE_UNIT:gram}
  monitor-interval-seconds: ${APP_MONITOR_INTERVAL_SECONDS:60}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
