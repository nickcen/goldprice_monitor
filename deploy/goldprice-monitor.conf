server {
    listen 80;
    listen [::]:80;
    server_name gold.chidugaiyi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gold.chidugaiyi.com;
    ssl_certificate /etc/nginx/ssl/chidugaiyi.com.cer;
    ssl_certificate_key /etc/nginx/ssl/chidugaiyi.com.key;
    root /var/www/goldprice-monitor;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /actuator/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
