[package]
name = "goldprice-monitor-desktop"
version = "0.1.0"
description = "Gold price monitor desktop application"
edition = "2021"

[lib]
name = "goldprice_monitor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
